# Render deployment config
# https://render.com/docs/web-services

services:
  - type: web
    name: sms-payment-system
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 30
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: MERCHANT_PHONE
        sync: false
      - key: MERCHANT_NAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
